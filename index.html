<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestra Galaxia ✨</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(ellipse at bottom, #1b1035 0%, #080314 60%, #020108 100%);
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    #space-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 1;
      pointer-events: none;
    }

    .bg-star {
      position: absolute;
      background-color: #ffffff;
      border-radius: 50%;
      opacity: 0.5;
      animation: twinkle-bg infinite alternate ease-in-out;
    }

    @keyframes twinkle-bg {
      0% { opacity: 0.1; transform: scale(0.8); }
      100% { opacity: 0.7; transform: scale(1.2); }
    }

    .star {
      position: absolute;
      cursor: pointer;
      color: #ffffff;
      font-size: 24px;
      user-select: none;
      text-shadow: 0 0 10px #ffffff, 0 0 20px #d697ff, 0 0 30px #a259ff;
      animation: twinkle linear infinite alternate;
      transition: transform 0.3s, text-shadow 0.3s;
      z-index: 10;
    }

    .star:hover {
      transform: scale(2.4) rotate(20deg) !important;
      text-shadow: 0 0 15px #ffffff, 0 0 30px #ff79c6, 0 0 45px #e0aaff;
      z-index: 50;
    }

    @keyframes twinkle {
      0% { opacity: 0.3; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.4; transform: scale(0.9); }
    }

    .content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 20px;
      pointer-events: none;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      text-shadow: 0 0 20px rgba(214, 151, 255, 0.8), 0 0 30px rgba(162, 89, 255, 0.6);
    }

    p.subtitle {
      font-size: 1.2rem;
      opacity: 0.9;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.9);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(4, 2, 10, 0.88);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: rgba(28, 18, 52, 0.88);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(214, 151, 255, 0.3);
      border-radius: 20px;
      padding: 25px;
      max-width: 520px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7), 0 0 20px rgba(162, 89, 255, 0.2);
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(25px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .media-container {
      width: 100%;
      max-height: 350px;
      overflow: hidden;
      border-radius: 14px;
      margin-bottom: 15px;
      display: none;
    }

    .modal-media {
      width: 100%;
      max-height: 350px;
      object-fit: contain;
      border-radius: 12px;
    }

    .modal-text {
      font-size: 1.15rem;
      line-height: 1.7;
      margin-bottom: 20px;
      font-weight: 300;
      white-space: pre-line;
      display: none;
    }

    .close-btn {
      background: linear-gradient(135deg, #c77dff, #7b2cbf);
      border: none;
      color: white;
      padding: 12px 30px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .close-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 18px rgba(199, 125, 255, 0.5);
    }
  </style>
</head>
<body>

  <div id="space-bg"></div>

  <div class="content">
    <h1>Feliz Primer Mes ✨</h1>
    <p class="subtitle">Haz clic en cada estrella para descubrir un secreto.</p>
  </div>

  <div class="modal" id="messageModal">
    <div class="modal-content">
      <div class="media-container" id="mediaContainer"></div>
      <div class="modal-text" id="modalText"></div>
      <button class="close-btn" onclick="closeModal()">Cerrar ✨</button>
    </div>
  </div>

  <script>
    const galaxiaDatos = [
      // ARCHIVOS MULTIMEDIA (3 Videos + 1 Foto)
      { type: "video", src: "video1.mp4" },
      { type: "video", src: "video2.mp4" },
      { type: "video", src: "video3.mp4" },
      { type: "image", src: "foto1.jpg" },

      // POEMAS Y MENSAJES PERSONALIZADOS (16)
      {
        type: "text",
        text: "Qué peligro esa mujer pensé al escucharte por primera vez. Peligrosamente mujer, peligrosamente tú. Y yo, un hombre de aventura y amante de los desafíos, cedí ciegamente a esa sonrisa que aceleraba peligrosamente mis latidos. Una parte dentro de mí me decía tonto, la otra afortunado, pero ninguna de las dos partes jamás pensaron en lo peligrosamente que estaría de ti enamorado. Enamorado de unos peligrosos ojos que paralizan, de unos peligrosos labios que cautivan, de un peligroso cabello que hipnotiza, de un hermoso cuerpo que desde lo lejos al deseo incita. Enamorado de ti, de la maravillosa mujer que eres, peligrosamente mujer, peligrosamente tú."
      },
      {
        type: "text",
        text: "Dime, ¿crees en la magia? Porque cada momento contigo se siente como algo mágico, como salido de un cuento. Por ratos, mientras hablo contigo, se me viene a la mente la escena de Peter Pan cuando Campanita está muriendo y la reaniman repitiendo que creen en las hadas. Y mágicamente vuelve a la vida. No te lo había dicho, pero eso provoca que sienta mariposas en el estómago. Porque siento que valió la espera que encontré a mi fiel compañera, la otra mitad de la cual no quiero separarme nunca más. Mi querida hada chalada."
      },
      {
        type: "text",
        text: "Dicen que algunos encuentros lo cambian todo y el nuestro es uno de ellos. Me haces querer ser mejor que ayer y por eso estoy totalmente agradecido contigo. Gracias."
      },
      {
        type: "text",
        text: "Las semillas no son tan malas después de todo, mi pichoncita. 💖"
      },
      {
        type: "text",
        text: "No a esas preguntas que no tienen respuesta. ✨"
      },
      {
        type: "text",
        text: "Me pareció muy lindo cuando le hablaste a la planta inexistente en audio para que yo escuchara. Qué linda. 🌱❤️"
      },
      {
        type: "text",
        text: "Gracias por los dibujos. Están muy lindos, me encantaron mucho. 🎨✨"
      },
      {
        type: "text",
        text: "Eres lo mejor que me pudo haber pasado. ✨"
      },
      {
        type: "text",
        text: "Te amo, mi amor. ❤️"
      },
      {
        type: "text",
        text: "Gracias por existir, mi princesa. 👑✨"
      },
      {
        type: "text",
        text: "El amor no conoce fronteras ni distancias. Al superar esta etapa seremos muy felices. 💕"
      },
      {
        type: "text",
        text: "Eres la mejor, nunca lo olvides. ✨"
      },
      {
        type: "text",
        text: "Qué peligro, Guillermina. 😏✨"
      },
      {
        type: "text",
        text: "Nuestro primer mes de novios. 🎉❤️"
      },
      {
        type: "text",
        text: "Significas mucho para mí. ✨"
      },
      {
        type: "text",
        text: "Gracias por haber llegado a mi vida. Te amo. ❤️"
      }
    ];

    // Fondo con estrellitas diminutas decorativas
    const spaceBg = document.getElementById('space-bg');
    for (let i = 0; i < 75; i++) {
      const bgStar = document.createElement('div');
      bgStar.className = 'bg-star';
      bgStar.style.left = `${Math.random() * 100}%`;
      bgStar.style.top = `${Math.random() * 100}%`;
      const size = Math.random() * 2 + 1;
      bgStar.style.width = `${size}px`;
      bgStar.style.height = `${size}px`;
      bgStar.style.animationDuration = `${(Math.random() * 3 + 2).toFixed(1)}s`;
      spaceBg.appendChild(bgStar);
    }

    // Estrellas interactivas
    const modal = document.getElementById('messageModal');
    const modalText = document.getElementById('modalText');
    const mediaContainer = document.getElementById('mediaContainer');

    galaxiaDatos.forEach((dato) => {
      const star = document.createElement('div');
      star.className = 'star';
      star.innerHTML = '✦';

      const posX = Math.random() * 86 + 7; 
      const posY = Math.random() * 86 + 7;
      const size = Math.floor(Math.random() * 12) + 20;
      const duration = (Math.random() * 2 + 1.5).toFixed(2);

      star.style.left = `${posX}%`;
      star.style.top = `${posY}%`;
      star.style.fontSize = `${size}px`;
      star.style.animationDuration = `${duration}s`;

      star.addEventListener('click', () => {
        mediaContainer.innerHTML = '';

        if (dato.type === 'image') {
          mediaContainer.innerHTML = `<img src="${dato.src}" class="modal-media" alt="Foto">`;
          mediaContainer.style.display = 'block';
          modalText.style.display = 'none';
        } else if (dato.type === 'video') {
          mediaContainer.innerHTML = `<video src="${dato.src}" class="modal-media" controls autoplay playsinline></video>`;
          mediaContainer.style.display = 'block';
          modalText.style.display = 'none';
        } else if (dato.type === 'text') {
          mediaContainer.style.display = 'none';
          modalText.innerText = dato.text;
          modalText.style.display = 'block';
        }

        modal.style.display = 'flex';
      });

      spaceBg.appendChild(star);
    });

    function closeModal() {
      const video = mediaContainer.querySelector('video');
      if (video) video.pause();
      modal.style.display = 'none';
    }
  </script>
</body>
</html>
